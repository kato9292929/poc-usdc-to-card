name: payjp-run
# PAY.JP のテストモードに実際に投げる実行。手動実行ができないため、runs-request/ にファイルを push したときだけ動く
# 結果は docs/runs/ と docs/examples/ にコミットする。キーは Secret PAYJP_SECRET_KEY からだけ読む
on:
  push:
    branches: [main]
    paths: ['runs-request/**']
permissions:
  contents: write
concurrency: payjp-run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: check secret
        env:
          PAYJP_SECRET_KEY: ${{ secrets.PAYJP_SECRET_KEY }}
        # 値は出さず、種類（先頭の決まった文字列）と長さ、余計な文字の有無だけを出す
        run: node --experimental-strip-types --no-warnings scripts/check-key.ts
      - run: npm test
      - name: 実証4（方式A・方式B）
        env:
          PAYJP_SECRET_KEY: ${{ secrets.PAYJP_SECRET_KEY }}
        run: npm run run-4 -- A B
      - name: 実証5
        if: always()
        env:
          PAYJP_SECRET_KEY: ${{ secrets.PAYJP_SECRET_KEY }}
        run: npm run run-5
      - name: commit results
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/runs docs/examples || true
          git commit -m "payjp run results" && git push || echo "nothing to commit"
